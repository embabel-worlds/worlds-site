# Build the site and publish it to Firebase Hosting.
#
# Firebase rather than GitHub Pages for one reason that matters: the project
# already serves me.embabel.com, and Pages allows a single custom domain per
# repository. Keeping both hostnames reachable from one build is the whole point
# of consolidating the marketing surfaces here, and Pages forecloses it.
#
# The build pulls the realm spec and install.sh from their own repos first — see
# scripts/pull.mjs. Both are public, so no token is needed to read them.
#
# Auth is Workload Identity Federation (no stored keys). The two GCP-side inputs
# live as repo variables — see README, "Before the first deploy" — because
# neither is secret: the WIF provider name is a public GCP resource path, and
# the SA email is only useful to a caller GCP already trusts.
name: Deploy

on:
  push:
    branches: [main]
  # The site quotes documents this repo does not own. A daily build republishes
  # them without anyone remembering to.
  schedule:
    - cron: '0 6 * * *'
  # The API reference is the one document that must not wait for 6am — the Worlds API
  # is under active change, and a reference a day behind it is a reference people stop
  # trusting. embabel/me's publish-openapi job fires this when, and only when, the
  # document it pushes to appliance-kit actually differs.
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for GitHub → GCP OIDC token exchange.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run build

      # Until the WIF vars are set, say so and stop. A red build on every push
      # would train everyone to ignore this workflow, and the build above is the
      # half worth watching in the meantime: it proves the site still builds from
      # the spec repo as that repo changes.
      - name: Check for deploy credentials
        id: creds
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$SA" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Built, not deployed — GCP_WIF_PROVIDER or GCP_DEPLOY_SA not set. See README, 'Before the first deploy'."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Install firebase-tools
        if: steps.creds.outputs.configured == 'true'
        run: npm install -g firebase-tools

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only hosting:worlds --project embabel-me-prod --non-interactive
